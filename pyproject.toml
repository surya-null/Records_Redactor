[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "records-redactor"
version = "0.1.0"
description = "Analyze patient-record PDFs for out-of-range results and PII."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pypdf>=5,<6",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "PyYAML>=6,<7",
    "pymupdf>=1.24,<2",
    "pytesseract>=0.3.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["records_redactor*"]